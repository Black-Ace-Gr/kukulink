{% extends "base.html" %}

{% block content %}

<div class="container py-5">

    <div class="col-md-6 mx-auto">

        <div class="card shadow">

            <div class="card-body">

                <h2 class="mb-4 text-center">
                    Create Account
                </h2>

                <form method="POST">

                    {% csrf_token %}

                    {{ form.as_p }}

                    <button class="btn btn-success w-100">

                        Register

                    </button>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
