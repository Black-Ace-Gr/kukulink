{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Kuku Link{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Main CSS --> <link rel="stylesheet" href="{% static 'css/style.css' %}"> <!-- AI Widget CSS -->
    <link rel="stylesheet" href="{% static 'css/ai.css' %}">
</head>
<body>
{% include "partials/navbar.html" %}
{% if messages %}
<div class="container mt-3"> {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show"> {{ message }}
        <button class="btn-close" data-bs-dismiss="alert"></button> </div> {% endfor %}
</div>
{% endif %}
<main>
    {% block content %}
    {% endblock %}
</main>
{% include "partials/footer.html" %}
{% include "ai/widget.html" %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
<!-- Main JS --> <script src="{% static 'js/script.js' %}"></script>
<!-- AI JS --> <script src="{% static 'js/ai.js' %}"></script>
</body>
</html>
