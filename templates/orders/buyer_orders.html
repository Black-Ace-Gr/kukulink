{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<h2>My Orders</h2>

<table class="table table-striped">

<tr>

<th>ID</th>

<th>Product</th>

<th>Status</th>

<th>Total</th>

<th></th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order.id }}</td>

<td>{{ order.product.title }}</td>

<td>{{ order.status }}</td>

<td>KES {{ order.total_price }}</td>

<td>

<a
href="{% url 'orders:detail' order.id %}"
class="btn btn-primary btn-sm">

View

</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="5">

No orders yet.

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
