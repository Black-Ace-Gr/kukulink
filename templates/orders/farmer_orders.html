{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<h2>Incoming Orders</h2>

<table class="table table-bordered">

<tr>

<th>ID</th>

<th>Buyer</th>

<th>Product</th>

<th>Quantity</th>

<th>Status</th>

</tr>

{% for order in orders %}

<tr>

<td>{{ order.id }}</td>

<td>{{ order.buyer.username }}</td>

<td>{{ order.product.title }}</td>

<td>{{ order.quantity }}</td>

<td>{{ order.status }}</td>

</tr>

{% empty %}

<tr>

<td colspan="5">

No incoming orders.

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
