{% extends "base.html" %}

{% block content %}

<div class="container py-5">

<div class="d-flex justify-content-between mb-4">

<h2>My Products</h2>

<a
href="{% url 'marketplace:create' %}"
class="btn btn-success">

Add Product

</a>

</div>

<table class="table table-bordered">

<tr>

<th>Image</th>

<th>Title</th>

<th>Price</th>

<th>Quantity</th>

<th>Actions</th>

</tr>

{% for product in products %}

<tr>

<td>

<img
src="{{ product.image.url }}"
width="80">

</td>

<td>{{ product.title }}</td>

<td>KES {{ product.price }}</td>

<td>{{ product.quantity }}</td>

<td>

<a
href="{% url 'marketplace:edit' product.id %}"
class="btn btn-warning btn-sm">

Edit

</a>

<a
href="{% url 'marketplace:delete' product.id %}"
class="btn btn-danger btn-sm">

Delete

</a>

</td>

</tr>

{% empty %}

<tr>

<td colspan="5">

No products added.

</td>

</tr>

{% endfor %}

</table>

</div>

{% endblock %}
