{% extends 'base.html' %}

{% block content %}

<div class="container py-5">

    <h2>Login</h2>

    <form method="POST">

        {% csrf_token %}

        <input
            class="form-control mb-3"
            type="text"
            name="username"
            placeholder="Username"
        >

        <input
            class="form-control mb-3"
            type="password"
            name="password"
            placeholder="Password"
        >

        <button class="btn btn-success">

            Login

        </button>

    </form>

</div>

{% endblock %}
